name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Must run before setup-node so its yarn cache detection uses the Yarn version from `packageManager`.
      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --immutable

      - name: TypeScript
        run: yarn typecheck

      - name: ESLint
        run: yarn lint

      - name: FSD architecture (Steiger)
        run: yarn lint:fsd

      - name: Production bundle
        run: yarn build:check
